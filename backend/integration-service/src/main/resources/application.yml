server:
  port: 8084

spring:
  application:
    name: integration-service
  datasource:
    url: ${INTEGRATION_DB_URL:jdbc:postgresql://localhost:5432/habitloop_integration}
    username: ${INTEGRATION_DB_USER:habitloop}
    password: ${INTEGRATION_DB_PASSWORD:habitloop}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

habitloop:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-habitloop-secret-key-min-32-bytes}
    issuer: habitloop
    access-token-seconds: 3600
    refresh-token-seconds: 1209600
  kafka:
    enabled: ${KAFKA_ENABLED:false}
  integration:
    webhook-base-url: ${WEBHOOK_BASE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.habitloop: INFO
