server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5432/habitloop_user}
    username: ${USER_DB_USER:habitloop}
    password: ${USER_DB_PASSWORD:habitloop}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

habitloop:
  jwt:
    # Dev placeholder only — override via env / Secrets Manager (see docs/08).
    secret: ${JWT_SECRET:dev-only-change-me-habitloop-secret-key-min-32-bytes}
    issuer: habitloop
    access-token-seconds: 3600
    refresh-token-seconds: 1209600
  # Seed a demo tenant + users on startup (local/dev only).
  seed-demo: ${SEED_DEMO:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.habitloop: INFO
