server:
  port: 8086

spring:
  application:
    name: recommendation-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: recommendation-service
      auto-offset-reset: earliest

habitloop:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-habitloop-secret-key-min-32-bytes}
    issuer: habitloop
    access-token-seconds: 3600
    refresh-token-seconds: 1209600
  events:
    transport: ${EVENTS_TRANSPORT:none}   # kafka | eventbridge | none
    source: habitloop.recommendation
    bus-name: ${EVENT_BUS_NAME:}
    queue-url: ${EVENT_QUEUE_URL:}         # SQS queue fed by the analytics.updated rule
  clients:
    analytics-service:
      url: ${ANALYTICS_SERVICE_URL:http://localhost:8085}
      connect-timeout-ms: 2000
      read-timeout-ms: 2000

resilience4j:
  circuitbreaker:
    instances:
      analyticsService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.habitloop: INFO
