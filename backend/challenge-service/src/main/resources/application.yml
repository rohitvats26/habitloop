server:
  port: 8083

spring:
  application:
    name: challenge-service
  datasource:
    url: ${CHALLENGE_DB_URL:jdbc:postgresql://localhost:5432/habitloop_challenge}
    username: ${CHALLENGE_DB_USER:habitloop}
    password: ${CHALLENGE_DB_PASSWORD:habitloop}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: challenge-service
      auto-offset-reset: earliest

habitloop:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-habitloop-secret-key-min-32-bytes}
    issuer: habitloop
    access-token-seconds: 3600
    refresh-token-seconds: 1209600
  events:
    transport: ${EVENTS_TRANSPORT:none}   # kafka | eventbridge | none
    source: habitloop.challenge
    bus-name: ${EVENT_BUS_NAME:}
    queue-url: ${EVENT_QUEUE_URL:}         # SQS queue fed by the activity.logged rule
  clients:
    user-service:
      url: ${USER_SERVICE_URL:http://localhost:8081}
      connect-timeout-ms: 2000
      read-timeout-ms: 2000

resilience4j:
  circuitbreaker:
    instances:
      userService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        # Business outcomes (e.g. 404 invitee-not-found) must not trip the breaker.
        ignore-exceptions:
          - com.habitloop.common.exception.ApiException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.habitloop: INFO
